# Fly.io staging app — deployed automatically on every merge to main
# (.github/workflows/deploy-staging.yml). See docs/agi/DEPLOY.md.
app = "gis-eye-staging"
primary_region = "dfw"

[env]
  PORT = "8080"
  GEV_BASE = "/globe/"
  # Staging stays unauthenticated so the post-deploy smoke test (and a direct look at the
  # fly.dev URL) works. To exercise SSO there, mirror the production block
  # (GEV_AUTH_MODE/GEV_JWT_ISSUER/GEV_JWT_AUDIENCE/GEV_LOGIN_URL + the GEV_JWT_HS256_SECRET secret).
  # License-gated layers stay off on hosted deploys until cleared
  # (DATA_SOURCES.md: OpenSky non-commercial, TeleGeography cables NC).
  GEV_FEATURE_OPENSKY = "0"
  GEV_FEATURE_CABLES = "0"
  # The limiters are opt-in and unlimited when unset — hosted deploys must
  # always set them explicitly.
  GEV_RATELIMIT_OPENAI_PER_MIN = "30"
  GEV_RATELIMIT_GOOGLE_PER_MIN = "120"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
